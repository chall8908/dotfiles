# Global user settings

[tools]
node = { version = "lts-krypton", postinstall = "corepack enable" }
python = 'latest'
ruby = "latest"
usage = "latest"
uv = "latest"
gh = "latest"
kubectl = "latest"

[env]
MISE_NODE_COREPACK = true
MISE_JOBS = "{{ num_cpus() }}"
GH_TOKEN = { value = "{{ exec(command='gh auth token') }}", tools = true }

[tool_alias.ruby.versions]
emacs = '3.4.7'
tools = '3.4.7'

[tool_alias.node.versions]
lts-hydrogen = '18'
lts-iron = '20'
lts-jod = '22'
lts-krypton = '24'
emacs = '24'

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node", "python"]

[settings.ruby]
compile = false
